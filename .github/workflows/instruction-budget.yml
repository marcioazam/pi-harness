name: instruction-budget

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: instruction-budget-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  instruction-budget:
    name: instruction-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            github.com:443
            api.github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails when always-loaded instructions grow past the baseline, unless the PR carries `budget-increase`.
      - name: Check always-loaded instruction budget
        run: python3 scripts/ci/instruction_budget.py check --labels-from-event "$GITHUB_EVENT_PATH"
